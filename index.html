<style>
:root{color-scheme:light;--ink:#3a2a6b;--soft:#6a5a96;--pk:#d4337f;--pkd:#b0246a;--bl:#2f6fd0;--rose:#ff5fa0;--gold:#ffc83d;--cream:#fffafd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{overflow-x:hidden;max-width:100%}
*{box-sizing:border-box;min-width:0}
button{touch-action:manipulation;font-family:inherit}
body{margin:0;max-width:100%;overflow-x:hidden;background:linear-gradient(170deg,#c9e8ff 0,#eaf3ff 40%,#ffd6ea 100%);background-attachment:fixed;color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:700;font-size:1rem;line-height:1.5;overflow-wrap:anywhere}
[hidden]{display:none!important}
.sp{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;overflow:hidden}
.sp i{position:absolute;font-style:normal;color:#f08ab8;animation:tw 3s ease-in-out infinite}

main{position:relative;z-index:1;width:100%;max-width:480px;margin:0 auto;padding:64px 16px 130px}
h1{font-family:Fredoka,sans-serif;font-weight:700;font-size:1.5rem;line-height:1.25;margin:0 0 8px;color:var(--pkd);text-align:center}
.intro{margin:0 0 14px;color:var(--soft);text-align:center;font-weight:600}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{padding:5px 14px;border-radius:999px;background:var(--cream);border:3px solid var(--ink);font:800 .9rem Nunito,sans-serif;color:var(--ink)}
button.chip{cursor:pointer;box-shadow:0 3px 0 var(--ink)}
button.chip:active{transform:translateY(3px);box-shadow:none}
/* HUD bawah */
.hud{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(255,250,253,.95);border-top:3px solid var(--ink)}
.hudi{max-width:480px;margin:0 auto}
.now{margin:0 0 6px;font-size:.88rem;line-height:1.35;text-align:center}
.atp{margin:0 0 6px;font-size:.85rem;line-height:1.35;text-align:center}
/* peta */
.mapi{position:relative;width:100%;padding-top:177.78%;border:4px solid var(--ink);border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#bfe0ff 0,#e9f1ff 45%,#ffd3e8 100%);box-shadow:0 5px 0 var(--ink)}
.mapimg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
.mapl{position:absolute;top:0;left:0;width:100%;height:100%;display:none;pointer-events:none}
.mapi.nomap .mapimg{display:none}

.mapd{position:absolute;top:0;left:0;right:0;bottom:0;display:none;pointer-events:none;font-size:2rem;opacity:.5}
.mapi.nomap .mapd{display:block}
.mk{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;padding:0;border:3px solid var(--ink);border-radius:50%;background:#fff;color:var(--ink);font:800 1.15rem Fredoka,sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 var(--ink);z-index:2}
.mk:active{margin-top:-23px;box-shadow:0 1px 0 var(--ink)}
.mk.done{background:var(--gold)}
.mk.open{background:var(--pk);color:#fff;animation:pl 1.8s infinite}
.mk.lk0{background:#e4e9f5;color:#6f7da0;border-color:#6b7a9c;box-shadow:0 3px 0 #9aa8c4}
.mk.hid{width:34px;height:34px;margin:-17px 0 0 -17px;background:rgba(255,255,255,.75);color:#6f7da0;border-color:#6b7a9c;box-shadow:none;font-size:1rem}
.mk .mn{pointer-events:none}
.ml{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:7px;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 10px;border:2px solid var(--ink);border-radius:999px;background:rgba(255,255,255,.96);color:var(--ink);font:800 .72rem Nunito,sans-serif;pointer-events:none}
.mk.hid .ml{display:none}
.mapi:not(.nomap) .ml{display:none}
.mb2{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:8px;white-space:nowrap;padding:3px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--gold);color:var(--ink);font:800 .72rem Nunito,sans-serif;pointer-events:none;animation:bob 1.6s ease-in-out infinite}
@keyframes pl{0%{box-shadow:0 4px 0 var(--ink),0 0 0 0 rgba(212,51,127,.55)}70%{box-shadow:0 4px 0 var(--ink),0 0 0 16px rgba(212,51,127,0)}100%{box-shadow:0 4px 0 var(--ink),0 0 0 0 rgba(212,51,127,0)}}
.ban{display:block;width:100%;height:120px;object-fit:cover;border:2px solid var(--ink);border-radius:10px;margin:0 0 10px;background:#dfeaff}
.nav{display:block;width:100%;margin-top:12px;padding:15px 12px;border:3px solid var(--ink);border-radius:16px;background:var(--pk);color:#fff;font:800 1.05rem Nunito,sans-serif;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.nav:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.nav.alt{background:#fff;color:var(--ink)}
.pin2:focus-visible,.nav:focus-visible,.chip:focus-visible,.mk:focus-visible,.cbtn:focus-visible,.mus:focus-visible,.sfxb:focus-visible,.sx:focus-visible,.dlg:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.slot{display:flex;align-items:center;justify-content:center;min-height:270px;border:4px dashed var(--ink);border-radius:20px;background:rgba(255,250,255,.8);margin-top:12px;padding:12px}
.stampw{transform:rotate(-8deg);display:flex;align-items:center;justify-content:center}
.stamp{width:236px;height:236px;border:6px solid var(--pk);border-radius:50%;box-shadow:inset 0 0 0 6px #fff,inset 0 0 0 9px var(--pk);background:#fff;color:var(--pk);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px}
.stamp b{font-family:Fredoka,sans-serif;font-size:1.05rem;line-height:1.2}
.stamp span{display:block;font-size:1.05rem;line-height:1.3;color:var(--ink);margin:6px 0}
.stamp em{display:block;font-style:normal;font-size:.82rem}
.capimg{display:none;width:min(300px,76vw);height:auto;filter:url(#kg) drop-shadow(0 6px 8px rgba(58,42,107,.3))}
.stampw.hasimg .capimg{display:block}
.stampw.hasimg .stamp{display:none}
.stampw.hit{animation:hit .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes hit{from{transform:rotate(-20deg) scale(1.8);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.stcap{margin:10px 0 0;text-align:center;font-family:Fredoka,sans-serif;color:var(--pkd);font-size:1rem;line-height:1.4}
.ph{margin:0;color:var(--soft);text-align:center;padding:0 20px}
.endc{margin:0 0 6px;padding:14px;border:3px solid var(--ink);border-radius:20px;background:var(--cream);text-align:center}
.endc b{display:block;font-family:Fredoka,sans-serif;font-size:1.15rem;color:var(--pkd);margin:2px 0 6px}
.endc small{display:block;color:var(--soft);font-weight:600}
.cf{position:fixed;z-index:70;font-size:1.7rem;pointer-events:none;animation:cf 1.5s ease-out forwards}
@keyframes cf{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:0}}
.end{margin:20px 0 0;text-align:center;font-family:Fredoka,sans-serif;font-size:1.05rem;line-height:1.5;color:var(--pkd)}
.end small{display:block;font-family:Nunito,sans-serif;font-size:.9rem;color:var(--soft);margin-top:6px;font-weight:600}
.mv{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;background:rgba(58,42,107,.6);display:flex;overflow-y:auto;padding:max(16px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom))}
.box{width:100%;max-width:440px;margin:auto;background:var(--cream);border:4px solid var(--ink);border-radius:22px;padding:16px}
.dd{border:3px solid var(--ink);border-radius:14px;background:#fff;text-align:center;padding:14px 12px}
.dk{margin:0;font-size:.78rem;letter-spacing:.08em;color:var(--soft)}
.dtt{margin:2px 0;font-family:Fredoka,sans-serif;font-size:1.25rem;line-height:1.25;color:var(--pkd)}
.dm{margin:6px 0;font-size:1.05rem}
.dm b{font-size:1.9rem}
.dq{margin:6px 0;font-weight:600;color:var(--soft)}
.dp{margin:10px 0 0;padding-top:10px;border-top:2px dashed var(--ink);font-size:.95rem}
.jl{margin:0 0 10px;text-align:left;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff}
.jl.no{background:#eceaf6;color:var(--soft)}
.jl b{display:block}
.jl span{font-weight:600;font-size:.92rem}
.jh{margin:12px 0 6px;font-family:Fredoka,sans-serif;font-size:.95rem;color:var(--pkd);text-align:center}
.ta{display:block;width:100%;height:96px;margin:10px 0 0;padding:8px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);font:600 .85rem monospace}
.mus,.sfxb{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));z-index:35;width:44px;height:44px;padding:0;border:3px solid var(--ink);border-radius:50%;background:#fff;font-size:1.2rem;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.mus{right:12px}.sfxb{right:64px}
.mus.on{background:#ffd9ea}
/* cerita */
.stg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;background:#fff}
.scn{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(var(--b1),var(--b2))}
.sx{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;z-index:5;height:44px;padding:0 14px;border:3px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);font:800 .9rem Nunito,sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.sb{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));left:12px;z-index:5;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.92);border:2px solid var(--ink);font-size:.85rem}
.sc{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end;font-size:2.6rem;opacity:.4;padding:0 6px 4px;pointer-events:none}
.sh{position:absolute;left:0;right:0;top:14%;text-align:center;font-size:2.6rem;pointer-events:none}
.scn.hasbg .sc,.scn.hasbg .sh{display:none}
.por{position:absolute;bottom:0;width:82%;height:84%;display:flex;align-items:flex-end;justify-content:center;transition:transform .25s,opacity .25s;pointer-events:none}
.por.me{left:-17%}.por.lu{right:-17%}
.por img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;opacity:0;filter:url(#kg) drop-shadow(0 6px 8px rgba(58,42,107,.35))}
.nokey .por img,.nokey .capimg{filter:drop-shadow(0 6px 8px rgba(58,42,107,.35))}
.por.ok img{opacity:1}
.por.flip img{transform:scaleX(-1)}
.por .pe{display:none;font-size:6rem;line-height:1;margin-bottom:18px}
.por.bad .pe{display:block}
.por.bad img{display:none}
.por.dim{opacity:.55;transform:scale(.94)}
.por.on{transform:scale(1.03);z-index:2}
.ubi{position:absolute;left:50%;top:15%;margin-left:-1.6rem;font-size:3.2rem;line-height:1;transition:transform .25s,opacity .25s;animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(58,42,107,.3));z-index:3;pointer-events:none}
.ubi.dim{opacity:.6}.ubi.on{transform:scale(1.25)}
@keyframes fl{0%,100%{margin-top:0}50%{margin-top:-14px}}
.dlg{position:relative;flex:none;background:rgba(255,250,255,.98);border-top:4px solid #f3a6c9;border-radius:26px 26px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));min-height:230px;cursor:pointer}
.dnm{display:inline-block;margin:-36px 0 6px;padding:3px 14px;border-radius:999px;background:var(--pk);color:#fff;font-weight:800;border:3px solid var(--ink)}
.dnm.P{background:var(--bl)}
.dnm.L{background:#7a49c9}
.dtx{font-size:1.08rem;line-height:1.6;min-height:4.8em}
.dtx.nar{font-style:italic;color:var(--soft)}
.dnx{position:absolute;right:20px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:1.2rem;color:var(--pk);animation:bb 1.2s ease-in-out infinite}
@keyframes bb{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.chs{display:grid;gap:10px;margin-top:6px}
.cbtn{padding:13px 14px;border:3px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink);font:800 1rem Nunito,sans-serif;text-align:left;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.bf{position:fixed;left:50%;top:38%;z-index:60;transform:translateX(-50%);padding:6px 16px;border-radius:999px;background:#fff;border:3px solid var(--rose);color:var(--rose);font-weight:800;animation:bfu 1.4s ease-out forwards;pointer-events:none}
@keyframes bfu{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-70px);opacity:0}}
@media (prefers-reduced-motion:reduce){.stampw.hit,.mk.open,.mb2,.dnx,.sp i,.chev,.ubi{animation:none}.cf,.bf{display:none}.lk{transition:opacity .3s}.lk.open{transform:none}}
/* layar kunci */
.lk{position:fixed;top:0;left:0;right:0;bottom:0;z-index:80;display:flex;flex-direction:column;align-items:center;text-align:center;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;background:url(lockscreen.jpg) center/cover no-repeat,linear-gradient(170deg,#b6dbff 0,#e1f0ff 45%,#ffd1e6 100%);padding:max(48px,calc(env(safe-area-inset-top,0px) + 32px)) 24px max(36px,calc(env(safe-area-inset-bottom,0px) + 24px));transition:transform .55s cubic-bezier(.3,.8,.3,1),opacity .55s}
.lk::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,.55) 0,rgba(255,255,255,0) 36%,rgba(255,255,255,0) 66%,rgba(255,255,255,.62) 100%);pointer-events:none}
.lk>*{position:relative}
.lk.open{transform:translateY(-100%);opacity:0;pointer-events:none}
.lk:focus-visible{outline:4px solid var(--rose);outline-offset:-8px}
.lk-date{margin:0;font-weight:800;text-shadow:0 1px 10px rgba(255,255,255,.95)}
.lk-time{margin:0;font-size:4.6rem;line-height:1.1;font-weight:800;text-shadow:0 1px 12px rgba(255,255,255,.95)}
.lk-title{margin:22px 0 6px;font-family:Fredoka,sans-serif;font-size:1.8rem;line-height:1.2;color:var(--pkd);text-shadow:0 1px 12px rgba(255,255,255,.95)}
.lk-sub{margin:0;color:var(--ink);text-shadow:0 1px 10px rgba(255,255,255,.95)}
.lk-bot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px}
.chev{font-size:1.8rem;line-height:1;color:var(--pkd);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(4px);opacity:.7}50%{transform:translateX(-50%) translateY(-4px);opacity:1}}
.lk .chev{animation:lb 1.6s ease-in-out infinite}
@keyframes lb{0%,100%{transform:translateY(4px);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
.lk-go{margin:0;padding:14px 30px;border:3px solid var(--ink);border-radius:16px;background:var(--pk);color:#fff;font-weight:800;font-size:1.1rem;box-shadow:0 5px 0 var(--ink)}
.lk-hint{margin:0;font-size:.85rem;color:var(--ink);text-shadow:0 1px 8px rgba(255,255,255,.95)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>

<script>
/* Layar kunci + musik: sengaja dipisah dan mandiri, supaya tetap jalan walau skrip cerita bermasalah */
(function(){
var d=document,$=function(id){return d.getElementById(id)};

function ac(){if(!AC){var C2=window.AudioContext||window.webkitAudioContext;if(C2)AC=new C2()}if(AC&&AC.state==="suspended")AC.resume();return AC}
function beep(f,t,d,type,v){var a=ac();if(!a)return;var o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.value=f;var s=a.currentTime+t;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(v||0.12,s+0.01);g.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+0.02)}
function sfx(k){
if(!PM.sfx)return;
if(k==="tap")beep(660,0,.06,"triangle");
else if(k==="ch")[523,784].forEach(function(f,i){beep(f,i*.08,.2,"triangle")});
else if(k==="up")[659,880,1175].forEach(function(f,i){beep(f,i*.08,.25,"sine",.1)});
else if(k==="win")[523,659,784,1047].forEach(function(f,i){beep(f,i*.1,.25,"triangle")});
else if(k==="fan")[523,659,784,1047,1319].forEach(function(f,i){beep(f,i*.12,.4,"triangle")});
}
function buzz(p){if(PM.sfx&&navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}}
function sfxUi(){$("sfxb").textContent=PM.sfx?"🔔":"🔕";$("sfxb").setAttribute("aria-label",PM.sfx?"Matikan efek suara":"Nyalakan efek suara")}
$("sfxb").addEventListener("click",function(){PM.sfx=!PM.sfx;savePM();sfxUi();if(PM.sfx)sfx("tap")});

function loadSpr(w,mood){
var im=$(w==="z"?"imz":"imo"),box=$(w==="z"?"pme":"plu");
if(im._m===mood)return;
im._m=mood;

function cond(n){

function next(){

}
